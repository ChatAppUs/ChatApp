name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static-and-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/admin/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python test dependency
        run: python -m pip install websockets
      - name: Parity and syntax validation
        run: |
          python tests/parity_check.py
          python scripts/validate-feature-registry.py
          python -m compileall -q services/ml
          node --check apps/extension/security.js
          node --check apps/extension/options.js
          node --check apps/extension/background.js
          git diff --check
      - name: Build web
        working-directory: apps/web
        run: npm ci --no-audit --no-fund && npm run build
      - name: Build admin
        working-directory: apps/admin
        run: npm ci --no-audit --no-fund && npm run build
      - name: Validate migrations are numbered and non-empty
        shell: bash
        run: |
          files=(infra/db/*.sql)
          test "${#files[@]}" -gt 0
          prev=0
          for f in "${files[@]}"; do
            n=${f##*/}; n=${n%%_*}
            [[ "$n" =~ ^[0-9]+$ ]] || { echo "bad migration: $f"; exit 1; }
            ((10#$n > prev)) || { echo "migration order error: $f"; exit 1; }
            test -s "$f"
            prev=$((10#$n))
          done

  backend-services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Go services
        shell: bash
        run: |
          set -euo pipefail
          for service in services/api services/mesh services/sfu; do
            (cd "$service" && go build ./... && go vet ./... && go test ./... )
          done
          # The race detector is run in addition to the plain suite, because CI
          # has historically omitted it and that is exactly how the mesh
          # receive-callback race and the alternate-path-retry defect reached
          # main behind a green build.
          (cd services/mesh && go test -race ./...)
          # A formatter check keeps the Go sources reviewable. Only the mesh
          # package is enforced today; services/api has pre-existing gofmt
          # drift that predates this workflow and is tracked separately.
          test -z "$(cd services/mesh && gofmt -l .)"
      - name: Test Rust services
        shell: bash
        run: |
          set -euo pipefail
          for service in services/authn services/security; do
            (cd "$service" && cargo test --locked)
          done

  # Database-backed end-to-end suites. Static analysis, a green build and unit
  # tests cannot see the class of defect these cover: a response-writer wrapper
  # that breaks the WebSocket hijack, a SQL statement that aborts its
  # transaction, a swallowed in-transaction error, a wrong status code, or an
  # authorization path that lets one user touch another's data. Two such
  # regressions previously reached `main` while this workflow stayed green
  # (ticket purchase returned 500 on every purchase; every WebSocket upgrade
  # returned 500), so these suites are now a required job.
  e2e-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: chatapp
          POSTGRES_PASSWORD: chatapp
          POSTGRES_DB: chatapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chatapp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: development
      DATABASE_URL: postgres://chatapp:chatapp@localhost:5432/chatapp?sslmode=disable
      JWT_SECRET: ci-jwt-secret-ci-jwt-secret-ci-jwt-secret
      SIGNING_SECRET: ci-signing-secret-ci-signing-secret-ci
      AUTHN_SECRET: ci-authn-secret-ci-authn-secret-ci-authn
      WALLET_MASTER_SEED: ci-wallet-seed-ci-wallet-seed-ci-wallets
      SFU_SECRET: ci-sfu-secret-ci-sfu-secret-ci-sfu-secret
      TURN_SECRET: ci-turn-secret-ci-turn-secret-ci-turn-sec
      COUNTERS_SECRET: ci-counters-secret-ci-counters-secret
      CLUSTER_SECRET: ci-cluster-secret-ci-cluster-secret
      # The suites create many accounts back to back; raise the abuse-control
      # ceilings (production default is unset = hardened values) so the tests
      # exercise behaviour rather than each other's rate limits.
      RATE_LIMIT_SCALE: 200
      CHATAPP_BASE: http://localhost:8080
      CHATAPP_WS: ws://localhost:8080
      # The media plane has to be reachable or every call/broadcast path answers
      # 502 "media service unavailable". It was never started before, which is
      # why the suite subset here avoided every call flow (see the run step).
      SFU_INTERNAL_URL: http://localhost:8095
      SFU_PUBLIC_URL: ws://localhost:8095/ws
      SFU_HOST: localhost
      # TURN_FORWARDER is a host:port consumed by the API's ICE builder;
      # 8099 is the forwarder's HTTP control port, while 3479 serves TURN.
      TURN_FORWARDER: localhost:3479
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          # websockets: realtime suite; cryptography: WebAuthn/passkey flow.
          python -m pip install --quiet websockets cryptography
      - name: Apply every migration to a fresh database
        shell: bash
        run: |
          set -euo pipefail
          for f in $(ls infra/db/*.sql | sort); do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: Build and start the Go SFU (media plane)
        shell: bash
        run: |
          set -euo pipefail
          (cd services/sfu && go build -o /tmp/sfu .)
          /tmp/sfu > /tmp/sfu.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:8095/health >/dev/null; then echo "sfu ready"; exit 0; fi
            sleep 1
          done
          echo "sfu did not become ready"; tail -50 /tmp/sfu.log; exit 1
      - name: Compile the C++ data planes and start the TURN relay forwarder
        shell: bash
        run: |
          set -euo pipefail
          # The specs state the ultra-low-latency data planes are C++ and that
          # strict C++17 compilation passes; nothing verified that in CI.
          for s in counters media realtime sfu-forwarder transcode; do
            g++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread \
              -o "/tmp/$s" "services/$s/main.cpp"
            echo "compiled $s"
          done
          /tmp/sfu-forwarder > /tmp/forwarder.log 2>&1 &
          for _ in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/8099) >/dev/null 2>&1; then echo "forwarder ready"; exit 0; fi
            sleep 1
          done
          echo "forwarder did not become ready"; tail -50 /tmp/forwarder.log; exit 1
      - name: Build and start the API
        shell: bash
        run: |
          set -euo pipefail
          (cd services/api && go build -o /tmp/api .)
          /tmp/api > /tmp/api.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf "$CHATAPP_BASE/ready" >/dev/null; then echo "api ready"; exit 0; fi
            sleep 1
          done
          echo "api did not become ready"; tail -50 /tmp/api.log; exit 1
      - name: Run every end-to-end suite against the live stack
        shell: bash
        run: |
          set -euo pipefail
          # Run ALL suites rather than a hand-picked subset. The previous subset
          # omitted integration_test and every call/broadcast suite, so the whole
          # media plane and the WebSocket/OTP paths went unexercised in CI.
          for f in tests/*_test.py; do
            t=$(basename "$f" .py)
            echo "=== $t ==="
            python3 "$f"
          done
      - name: API log on failure
        if: failure()
        run: tail -200 /tmp/api.log
