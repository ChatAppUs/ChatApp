services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chatapp
      POSTGRES_PASSWORD: chatapp
      POSTGRES_DB: chatapp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatapp"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  api:
    build: ./services/api
    env_file: .env
    environment:
      DATABASE_URL: postgres://chatapp:chatapp@postgres:5432/chatapp?sslmode=disable
      MONGO_URL: mongodb://mongo:27017/chatapp
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: minio:9000
      SFU_INTERNAL_URL: http://sfu:8095
      SFU_PUBLIC_URL: ws://localhost:8095/ws
      SFU_HOST: localhost
      SFU_SECRET: change-me-sfu-secret
      TURN_SECRET: change-me-turn-secret
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Self-built SFU: group calls, meetings, live broadcasting + embedded
  # STUN/TURN. No external media kit.
  sfu:
    build: ./services/sfu
    environment:
      SFU_SECRET: change-me-sfu-secret
      TURN_SECRET: change-me-turn-secret
      PUBLIC_IP: 127.0.0.1
    ports:
      - "8095:8095"
      - "3478:3478/udp"

  security:
    build: ./services/security
    ports:
      - "8090:8090"

  media:
    build: ./services/media
    ports:
      - "8100:8100"
    volumes:
      - mediauploads:/data/uploads

  ml:
    build: ./services/ml
    ports:
      - "8200:8200"

  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - api

  # Admin console — a fully separate application from the user platform,
  # with its own login plane (POST /api/admin/login, admin-scoped tokens).
  admin:
    build: ./apps/admin
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3100:3100"
    depends_on:
      - api

volumes:
  pgdata:
  mongodata:
  miniodata:
  mediauploads:
